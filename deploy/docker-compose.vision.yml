# Optional: free local vision model for AI scene notes.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.vision.yml --profile llm up -d --build
#   docker compose -f deploy/docker-compose.yml exec ollama ollama pull qwen2.5vl:7b     # ~6 GB, needs ~8–10 GB RAM/VRAM
# The worker joins the internal 'app' network so it can reach Ollama. That network has no internet route,
# so frames still never leave this machine.
services:
  worker:
    network_mode: !reset null
    networks: [app]
    environment:
      CINEVISION_OLLAMA_URL: http://ollama:11434
      CINEVISION_OLLAMA_VISION_MODEL: qwen2.5vl:7b
  api:
    environment:
      CINEVISION_OLLAMA_URL: http://ollama:11434
      CINEVISION_OLLAMA_VISION_MODEL: qwen2.5vl:7b
