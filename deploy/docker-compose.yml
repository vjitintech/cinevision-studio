# Private/local mode. Run from the repository root:
#   python scripts/gen_keys.py deploy/secrets
#   docker compose -f deploy/docker-compose.yml up -d --build
# Then open https://localhost:8443 (trust Caddy's local certificate once).
name: cinevision

x-app: &app
  build: { context: .., dockerfile: Dockerfile }
  image: cinevision-studio:local
  restart: unless-stopped
  user: "10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m"]
  secrets: [master_key]
  volumes: ["cinevision-data:/data"]
  environment: &env
    CINEVISION_MODE: local
    CINEVISION_MASTER_KEY_FILE: /run/secrets/master_key
    CINEVISION_PUBLIC_ORIGIN: https://localhost:8443
    CINEVISION_COOKIE_SECURE: "true"
    CINEVISION_TRUST_PROXY: "true"
    CINEVISION_MAX_UPLOAD_MB: "500"
    CINEVISION_MAX_DURATION_S: "300"
    # CINEVISION_ALLOW_REGISTRATION: "false"   # first account becomes owner; registration then closes
    # CINEVISION_CLAMD_SOCKET: /clamd/clamd.sock  # with the 'scan' profile
    # CINEVISION_OLLAMA_URL: http://ollama:11434  # with the 'llm' profile
    # CINEVISION_OLLAMA_MODEL: llama3.2

services:
  api:
    <<: *app
    command: ["python", "-m", "cinevision.app"]
    networks: [app]            # internal network only: no route to the internet
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s

  worker:
    <<: *app
    command: ["python", "-m", "cinevision.worker"]
    network_mode: none         # decodes untrusted media: no network at all
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4g }

  web:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports: ["127.0.0.1:8443:8443"]   # bound to this machine only
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [edge, app]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  clamav:
    profiles: [scan]
    image: clamav/clamav:stable
    volumes: ["clamd-sock:/tmp"]
    networks: [edge]           # needs internet for signature updates; never sees the API network

  ollama:
    profiles: [llm]
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]
    networks: [app]

networks:
  edge: {}
  app: { internal: true }

volumes:
  cinevision-data: {}
  caddy-data: {}
  clamd-sock: {}
  ollama: {}

secrets:
  master_key:
    file: ./secrets/master_key
