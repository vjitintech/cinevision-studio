name: pages
# Builds the browser edition and publishes it to the gh-pages branch on every push to main.
# GitHub Pages serves that branch at https://<owner>.github.io/<repo>/ (Settings → Pages → Deploy from a branch → gh-pages / root).
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build browser edition
        run: cd frontend && npm install --no-audit --no-fund && npm run build:pages
      - name: Publish to gh-pages
        run: |
          cd frontend/dist-pages
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish browser edition from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
